<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testing Page</title>

  <style>
    body, html {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
    }

    .aurora-container {
      width: 100%;
      height: 100%;
      background: linear-gradient(
        120deg,
        #f0f0f0,
        #cfd9df,
        #f0f0f0
      );
      animation: aurora 6s infinite alternate;
    }

    @keyframes aurora {
      from { filter: blur(20px); }
      to { filter: blur(40px); }
    }
  </style>
</head>
<body>

  <div class="aurora-container"></div>

</body>
</html>
